<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="45%" stop-color="#0e1322"/>
      <stop offset="80%" stop-color="#12182e"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>

    <!-- Title Glow & Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .badge-text { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #38bdf8; text-transform: uppercase; }
    .title { font-size: 52px; font-weight: 800; letter-spacing: -1px; fill: url(#titleGrad); }
    .subtitle { font-size: 19px; font-weight: 400; fill: #94a3b8; }
    .pill-label { font-size: 12px; font-weight: 600; fill: #cbd5e1; }
    .code-tag { font-size: 11px; fill: #64748b; }
    .anim-pulse { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)"/>

  <!-- Border Gradient Stroke -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="90" r="140" fill="#38bdf8" fill-opacity="0.07" filter="url(#neonGlow)"/>
  <circle cx="1060" cy="310" r="160" fill="#c084fc" fill-opacity="0.07" filter="url(#neonGlow)"/>
  <circle cx="600" cy="200" r="220" fill="#6366f1" fill-opacity="0.04" filter="url(#neonGlow)"/>

  <!-- Left Side: Glowing Constellation / Prompt Graph -->
  <g opacity="0.75" transform="translate(40, 20)">
    <!-- Connections -->
    <path d="M 60,90 L 140,50 L 220,100 L 180,180 L 80,160 Z" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
    <path d="M 140,50 L 180,180 M 60,90 L 220,100" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    
    <!-- Nodes -->
    <circle cx="60" cy="90" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="140" cy="50" r="6" fill="#818cf8" filter="url(#softGlow)"/>
    <circle cx="220" cy="100" r="5" fill="#c084fc" filter="url(#softGlow)"/>
    <circle cx="180" cy="180" r="4.5" fill="#f472b6" filter="url(#softGlow)"/>
    <circle cx="80" cy="160" r="4" fill="#00f2fe" filter="url(#softGlow)"/>

    <!-- Subtle Node Annotations -->
    <text x="35" y="112" class="font-mono code-tag" font-size="9">&lt;system&gt;</text>
    <text x="145" y="42" class="font-mono code-tag" font-size="9">CoT</text>
    <text x="228" y="105" class="font-mono code-tag" font-size="9">DSPy</text>
    <text x="185" y="198" class="font-mono code-tag" font-size="9">ReAct</text>
  </g>

  <!-- Right Side: Directed Cognitive Tree / DAG Graph -->
  <g opacity="0.8" transform="translate(930, 45)">
    <!-- Branches -->
    <path d="M 130,40 L 70,110 M 130,40 L 190,110" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M 70,110 L 30,190 M 70,110 L 100,190" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 190,110 L 160,190 M 190,110 L 230,190" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 100,190 L 130,240 M 160,190 L 130,240" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Graph Nodes -->
    <circle cx="130" cy="40" r="7" fill="#818cf8" filter="url(#neonGlow)"/>
    <circle cx="70" cy="110" r="6" fill="#38bdf8"/>
    <circle cx="190" cy="110" r="6" fill="#c084fc"/>
    <circle cx="30" cy="190" r="4.5" fill="#64748b"/>
    <circle cx="100" cy="190" r="5" fill="#38bdf8"/>
    <circle cx="160" cy="190" r="5" fill="#c084fc"/>
    <circle cx="230" cy="190" r="4.5" fill="#64748b"/>
    <!-- Optimal Solution Node -->
    <circle cx="130" cy="240" r="7" fill="#4ade80" filter="url(#neonGlow)"/>

    <text x="145" y="245" class="font-mono" font-size="10" font-weight="700" fill="#4ade80">y* (SOTA)</text>
    <text x="142" y="38" class="font-mono code-tag" font-size="9">Root</text>
    <text x="202" y="113" class="font-mono code-tag" font-size="9">ToT</text>
  </g>

  <!-- Central Header Content -->
  <g transform="translate(600, 0)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 68)">
      <rect x="-190" y="-15" width="380" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="-168" cy="0" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="8" y="4" class="font-mono badge-text" text-anchor="middle">FRONTIER ENCYCLOPEDIA &amp; BLUEPRINT</text>
    </g>

    <!-- Hero Title -->
    <text y="152" class="font-base title" filter="url(#softGlow)">PROMPT ENGINEERING MASTERY</text>

    <!-- Subtitle -->
    <text y="196" class="font-base subtitle">
      From Core Foundations &amp; Frontier Reasoning Models to DSPy, TextGrad &amp; Threat Defense
    </text>

    <!-- Floating Technical Delimiters -->
    <g transform="translate(0, 238)">
      <text x="-310" class="font-mono code-tag" font-size="12">&lt;system_prompt&gt;</text>
      <text x="-160" class="font-mono code-tag" font-size="12">P(Y | X, Z)</text>
      <text x="0" class="font-mono code-tag" font-size="12">[In-Context Optimization]</text>
      <text x="175" class="font-mono code-tag" font-size="12">τ ∈ [0.0, 0.7]</text>
      <text x="315" class="font-mono code-tag" font-size="12">&lt;/system_prompt&gt;</text>
    </g>

    <!-- Architecture Capability Pills -->
    <g transform="translate(0, 312)">
      <!-- Pill 1: Reasoning -->
      <g transform="translate(-400, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="8" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text y="5" class="font-base pill-label" text-anchor="middle">🧠 CoT · ToT · GoT</text>
      </g>

      <!-- Pill 2: Reasoning Models -->
      <g transform="translate(-195, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="8" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
        <text y="5" class="font-base pill-label" text-anchor="middle">🔬 o1 / o3 · DeepSeek-R1</text>
      </g>

      <!-- Pill 3: Programmatic DSPy -->
      <g transform="translate(10, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="8" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
        <text y="5" class="font-base pill-label" text-anchor="middle">⚙️ DSPy · TextGrad · APE</text>
      </g>

      <!-- Pill 4: Security -->
      <g transform="translate(215, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="8" fill="url(#pillGrad)" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
        <text y="5" class="font-base pill-label" text-anchor="middle">🛡️ Injection &amp; Jailbreak</text>
      </g>

      <!-- Pill 5: Multimodal & Evals -->
      <g transform="translate(415, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="8" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
        <text y="5" class="font-base pill-label" text-anchor="middle">👁️ Vision · G-Eval Bench</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(0, 385)">
      <line x1="-480" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="-160" cy="0" r="3" fill="#10b981"/>
      <text x="-148" y="3" class="font-mono code-tag" font-size="10" text-anchor="start">PRODUCTION-GRADE</text>
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
      <text x="12" y="3" class="font-mono code-tag" font-size="10" text-anchor="start">RUNNABLE PYTHON COOKBOOKS</text>
      <circle cx="180" cy="0" r="3" fill="#c084fc"/>
      <text x="192" y="3" class="font-mono code-tag" font-size="10" text-anchor="start">100% OPEN SCIENCE</text>
    </g>
  </g>
</svg>
